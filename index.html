<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b18"><title>Daymark — Discipline, made visible</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section class="auth"><div class="brand"><span class="mark">✳</span> daymark</div><h1>Make your days<br>count for something.</h1><p>Your one-year plan, held gently and honestly.</p><form id="authForm"><label>Your name<input name="name" required autocomplete="username" placeholder="Name"></label><label>Password<input name="password" required minlength="10" type="password" autocomplete="current-password" placeholder="At least 10 characters"></label><button class="primary">Create your account</button></form><button class="switch" id="switchAuth">Already have an account? Sign in</button><small id="authError"></small><div class="auth-note">Private to this device · Your data stays in your local tracker</div></section></main><script src="/app.js"></script></body></html>
